name: Mentis
options:
  bundleIdPrefix: com.mentis
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

targets:
  Mentis:
    type: application
    platform: iOS
    sources:
      - path: Mentis
    info:
      path: Mentis/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: YES
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Mentis uses the camera for AR scanning and anchor placement."
        NSPhotoLibraryUsageDescription: "Mentis can attach photos to your learning anchors."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: YES
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.oguzhan.mentis
        INFOPLIST_FILE: Mentis/Info.plist
    dependencies:
      - sdk: ARKit.framework
      - sdk: SceneKit.framework
      - sdk: RealityKit.framework
      - sdk: RoomPlan.framework
        weak: true
